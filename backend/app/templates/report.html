<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校验报告 - {{ task_name }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #409eff; padding-bottom: 10px; }
        .summary { display: flex; gap: 20px; margin: 20px 0; }
        .stat { flex: 1; padding: 15px; border-radius: 6px; text-align: center; }
        .stat-total { background: #ecf5ff; color: #409eff; }
        .stat-passed { background: #f0f9eb; color: #67c23a; }
        .stat-failed { background: #fef0f0; color: #f56c6c; }
        .stat h3 { margin: 0; font-size: 28px; }
        .stat p { margin: 5px 0 0; font-size: 14px; color: #666; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin: 15px 0; }
        .progress-fill { height: 100%; border-radius: 4px; background: #67c23a; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f5f7fa; padding: 12px; text-align: left; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        .success { color: #67c23a; font-weight: bold; }
        .fail { color: #f56c6c; font-weight: bold; }
        .meta { color: #999; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>校验报告 - {{ task_name }}</h1>
        <p class="meta">生成时间: {{ generated_at }}</p>
        <div class="summary">
            <div class="stat stat-total"><h3>{{ total }}</h3><p>总规则数</p></div>
            <div class="stat stat-passed"><h3>{{ passed }}</h3><p>通过</p></div>
            <div class="stat stat-failed"><h3>{{ failed }}</h3><p>失败</p></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: {{ pass_rate }}%"></div></div>
        <p>通过率: <strong>{{ pass_rate }}%</strong></p>
        <table>
            <thead><tr><th>规则类型</th><th>结果</th><th>参数</th></tr></thead>
            <tbody>
            {% for r in results %}
            <tr>
                <td>{{ r.expectation_type }}</td>
                <td class="{{ 'success' if r.success else 'fail' }}">{{ '通过' if r.success else '失败' }}</td>
                <td><code>{{ r.kwargs | tojson }}</code></td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
